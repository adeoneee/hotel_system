name: "Commitlint"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate commits (push)
        if: github.event_name == 'push'
        run: |
          npx --yes --package @commitlint/cli commitlint --config commitlint.config.cjs --from ${{ github.event.before }} --to ${{ github.sha }} --verbose

      - name: Validate commits (pull request)
        if: github.event_name == 'pull_request'
        run: |
          npx --yes --package @commitlint/cli commitlint --config commitlint.config.cjs --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
