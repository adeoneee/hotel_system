name: "Release"

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          if git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "Тег указывает на коммит из main. Релиз разрешен."
          else
            echo "ОШИБКА: Тег указывает на коммит, которого НЕТ в main!"
            echo "Релизить можно только код из ветки main."
            exit 1
          fi
    
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x hotel_backend/gradlew

      - name: Build backend JAR
        working-directory: hotel_backend
        run: ./gradlew bootJar -x test

      - name: Rename JAR
        run: |
          mkdir -p artifacts
          find hotel_backend/build/libs -name "*.jar" ! -name "*-plain.jar" \
            -exec cp {} artifacts/hotel-backend-${{ github.ref_name }}.jar \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
