name: "Backend CI"

on:
  push:
    branches: [main, develop]
    paths:
      - 'hotel_backend/**'                              # ← было 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'hotel_backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotel_backend               # ← было backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: SpotBugs
        run: ./gradlew spotbugsMain spotbugsTest

      - name: Run tests
        run: ./gradlew test

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: hotel_backend/build/reports/checkstyle/    
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: hotel_backend/build/reports/spotbugs/    