
databaseChangeLog:
  - changeSet:
      id: "001-create-rooms"
      author: "adeoneee"
      changes:
        - createTable:
            tableName: rooms
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_rooms
                    nullable: false

              - column:
                  name: room_number
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: room_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: capacity
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: price_per_night
                  type: NUMERIC(10, 2)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: 'AVAILABLE'
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: rooms
            columnNames: room_number
            constraintName: uq_rooms_room_number

        - sql:
            sql: |
              ALTER TABLE rooms
              ADD CONSTRAINT chk_rooms_capacity
              CHECK (capacity > 0)

        - sql:
            sql: |
              ALTER TABLE rooms
              ADD CONSTRAINT chk_rooms_price
              CHECK (price_per_night > 0)

        - sql:
            sql: |
              ALTER TABLE rooms
              ADD CONSTRAINT chk_rooms_type
              CHECK (room_type IN ('STANDARD', 'LUX'))

        - sql:
            sql: |
              ALTER TABLE rooms
              ADD CONSTRAINT chk_rooms_status
              CHECK (
                status IN (
                  'AVAILABLE',
                  'OCCUPIED',
                  'CLEANING',
                  'MAINTENANCE'
                )
              )

        - createIndex:
            tableName: rooms
            indexName: idx_rooms_status_capacity
            columns:
              - column:
                  name: status
              - column:
                  name: capacity
