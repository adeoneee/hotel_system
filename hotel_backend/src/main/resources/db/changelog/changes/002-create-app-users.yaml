databaseChangeLog:
  - changeSet:
      id: "002-create-app-users"
      author: "adeoneee"
      changes:
        - createTable:
            tableName: app_users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_app_users
                    nullable: false

              - column:
                  name: full_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(254)
                  constraints:
                    nullable: false

              - column:
                  name: password_hash
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: app_users
            columnNames: email
            constraintName: uq_app_users_email

        - sql:
            sql: |
              ALTER TABLE app_users
              ADD CONSTRAINT chk_app_users_role
              CHECK (role IN ('GUEST', 'ADMIN', 'MANAGER'))